name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Branch, tag, or commit to test (blank uses the selected workflow branch)'
        required: false
        type: string

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.test_ref || '' }}

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

  version-bump:
    name: Version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SCRIPT_VERSION bump when router-delivered files change
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base_sha" HEAD | grep -E '^(vpnmgr\.sh|vpnmgr_www\.(asp|js)|www/.+|providers/provider_.+\.sh)$' || true)

          if [ -z "$changed" ]; then
            echo "No router-delivered files changed — version check skipped."
            exit 0
          fi

          echo "Changed router-delivered files:"
          echo "$changed"

          base_ver=$(git show "${base_sha}:vpnmgr.sh" | grep -m1 'SCRIPT_VERSION=' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          head_ver=$(grep -m1 'SCRIPT_VERSION=' vpnmgr.sh | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')

          echo "Base version : $base_ver"
          echo "Branch version: $head_ver"

          if [ "$base_ver" = "$head_ver" ]; then
            echo "ERROR: router-delivered files changed but SCRIPT_VERSION was not bumped in vpnmgr.sh"
            exit 1
          fi

          echo "OK: $base_ver -> $head_ver"
